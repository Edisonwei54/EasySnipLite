name: 功能建议
description: 提出新功能或改进想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请说明使用场景，帮助我们判断优先级。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你遇到了什么场景或痛点？这个功能解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你期望的行为或交互是什么样的？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过其他实现方式吗？（可选）
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考工具、截图、示例等（可选）
