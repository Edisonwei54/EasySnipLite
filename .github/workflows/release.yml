name: Release

# 打 tag v* 时自动发布：publish 单文件 exe → 挂到 GitHub Releases
# 用法：git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file exe
        run: dotnet publish src/EasySnipLite -c Release -r win-x64 -o dist

      - name: Create GitHub Release
        # 用 ${{ github.ref_name }} 而非 $GITHUB_REF_NAME——默认 shell 为 PowerShell，
        # $GITHUB_REF_NAME 会被当成普通变量（空），需 $env: 前缀或 GitHub 表达式
        run: |
          gh release create "${{ github.ref_name }}" dist/EasySnipLite.exe `
            --title "EasySnipLite ${{ github.ref_name }}" `
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
