name: Release

# 打 tag v* 时自动发布：publish 单文件 exe → 挂到 GitHub Releases
# 用法：git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file exe
        run: dotnet publish src/EasySnipLite -c Release -r win-x64 -o dist

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/EasySnipLite.exe `
            --title "EasySnipLite $GITHUB_REF_NAME" `
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
